services:
  app:
    build: ./docker/
    container_name: app
    ports: 
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/Apache/sites-available:/etc/apache2/sites-available
    env_file:
      - ./docker/.env
    depends_on:
      - db
  db:
    image: mariadb:11.4
    container_name: db
    ports: 
      - "3306:3306"
    volumes:
      - ./docker/MariaDB/data:/var/lib/mysql
    env_file:
      - ./docker/.env